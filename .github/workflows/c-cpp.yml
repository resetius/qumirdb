name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    permissions:
      checks: write
      pull-requests: write
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install Arrow apt source
      run: |
        sudo apt-get install -y ca-certificates lsb-release wget
        CODENAME=$(lsb_release --codename --short)
        wget "https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-${CODENAME}.deb"
        sudo apt-get install -y "./apache-arrow-apt-source-latest-${CODENAME}.deb"
    - name: apt-get update
      run: sudo apt-get update
    - name: Install packages
      run: sudo apt-get install -y cmake ninja-build pkg-config llvm-20-dev lld libgtest-dev libarrow-dev libparquet-dev libreadline-dev g++-14
    - name: Configure
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
          -DLLVM_DIR="$(llvm-config-20 --cmakedir)" \
          -DCMAKE_PREFIX_PATH="$(llvm-config-20 --prefix)" \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER=gcc-14
    - name: Build
      run: cmake --build build
    - name: Test
      run: cmake --build build --target test
    - name: Test log on failure
      if: failure()
      run: cat build/Testing/Temporary/LastTest.log
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: build/test/*.xml
        check_name: Unit Test Results (Linux)
